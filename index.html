<header class="hdr"><div class="in">
<div class="top">
  <div class="brand-cluster">
    <div class="brand" onclick="go('dash')">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="17 15 66 70"><use href="#dicatat-mark"/></svg></div>
      <div class="brand-txt">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="brand-name">Dicatat!</span>
          <span class="mob-view-pill" id="mob-view-pill"></span>
        </div>
        <span class="brand-sub" id="hdr-sub">Maganghub Mode · Secured Finance</span>
      </div>
    </div>
    <span class="mh-hdr-sep" aria-hidden="true"></span>
    <div class="mh-brand" onclick="mhChange()" id="mh-hdr-brand" title="Maganghub Class">
      <img class="mh-logo on-light" src="MagangHub%20Logo%20-%20Black%20-%20zonalogo.com.svg" alt="Maganghub" decoding="async">
      <img class="mh-logo on-dark" src="MagangHub%20Logo%20-%20White%20-%20zonalogo.com.svg" alt="" aria-hidden="true" decoding="async">
      <span class="mh-cls-pill" id="mh-cls-pill"></span>
    </div>
  </div>
  <div class="top-r">
    <span class="user-dt" id="user"></span>
    <button class="hdr-btn" onclick="go('rep')" id="hdr-rep-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span id="hdr-rep-lbl">Period Report</span>
    </button>
    <button class="hdr-btn pri" onclick="addTx()" id="hdr-add-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span id="hdr-add-lbl">Add entry</span>
    </button>
  </div>
